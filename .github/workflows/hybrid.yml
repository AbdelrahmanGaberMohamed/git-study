name: Hybrid workflow
on:
    workflow_dispatch:
jobs:
    hybrid_job:
        runs-on: ubuntu-latest
        steps:
            - name: Run a command on ubuntu VM
              run: echo "This is runs on ubuntu VM"
            - name: Run a command in docker container
              uses: docker://alpine:latest
              with:
                entrypoint: /bin/sh
                args: |
                    -c echo "This is runs in docker container"
                    -c echo "exiting ... Bye ..."
                    