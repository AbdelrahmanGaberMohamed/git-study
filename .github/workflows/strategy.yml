name: strategy-workflow
on:
    workflow_dispatch:
jobs:
    job1:
        strategy:
            fail-fast: false
            max-parallel: 3
            matrix:
                os: 
                    - ubuntu-latest
                    - windows-latest
                    - macos-latest
                python-version: 
                    - '3.9'
                    - '3.10'
                    - '3.11'
                    - '3.12'
                    - '3.13'
                    - '3.14'
        runs-on: ${{ matrix.os }}
        steps:
            - name: checkout code
              uses: actions/checkout@v6.1.0
            - name: set up python ${{ matrix.python-version }}
              uses: actions/setup-python@v6.1.0
              with:
                python-version: ${{ matrix.python-version }}
            - name: run main code
              run: python3 src/main.py