name: manual
on: 
  repository_dispatch: 
    types: 
      - incident_report
  workflow_dispatch:
    inputs:
      environment:
        description: "Choose environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
jobs:
  handle-incident:
    runs-on: ubuntu-latest
    steps:
      - name: print incident details
        run: echo "Incident reported"
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: deploy application
        run: echo "Deploying application to ${{ inputs.environment }} ..."
      - name: get secrets
        run: echo "${{ secrets.API_KEY }}"
