name: first-workflow

on:
  push:
    branches: 
      - main
  pull_request:
    branches:
      - main

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v6.1.0
      - name: list repository files
        run: ls -la
  test:
    needs: checkout
    runs-on: ubuntu-latest
    steps:
      - name: log action
        run: echo "Push or pull request event triggered"
